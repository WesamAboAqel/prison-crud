services:
  db:
    image: postgres:17
    container_name: prison-db
    environment:
      POSTGRES_USER: prison_user
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_DB: prison_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d

  backend:
    build: ./Prison-BackEnd
    container_name: prison-backend
    command: npm run dev
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./Prison-BackEnd:/app

  frontend:
    build: ./Prison-FrontEnd
    container_name: prison-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./Prison-FrontEnd:/app
      - /app/node_modules 

volumes:
  pgdata: